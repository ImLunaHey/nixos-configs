<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Homelab · Systems</title>
<style>
:root{color-scheme:dark;font:clamp(14px,.85vw,27px)/1.4 Inter,sans-serif;--text:#eeeeee;--muted:#a4a4a4;--surface:#232323;--inset:#2b2b2b;--green:#dddddd;--amber:#e5ae51;--red:#ef806c}*{box-sizing:border-box}body{margin:0;background:#101010;color:var(--text);font-variant-numeric:tabular-nums;overflow:hidden}body:before{content:"";position:fixed;inset:0;background:none;pointer-events:none}main{position:relative;height:100vh;padding:1.5rem 2rem 1rem;display:flex;flex-direction:column;gap:1rem}header{display:flex;justify-content:space-between;align-items:center}h1,h2,h3,p{margin:0}h1{font-weight:500;font-size:1.4rem;letter-spacing:-.045em}.eyebrow{font-size:.45rem;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin-bottom:.2rem}.clock{font-size:1rem;text-align:right}.date{font-size:.48rem;color:var(--muted);text-align:right}.machines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;flex:1;min-height:0}.machine{background:#1e1e1e;border:1px solid #ffffff09;border-radius:1.15rem;padding:1.1rem;display:flex;flex-direction:column;gap:.75rem;min-width:0;min-height:0;box-shadow:0 .4rem 1.4rem #0002}.machine-head{display:flex;align-items:center;justify-content:space-between;gap:1rem}.identity{display:flex;gap:.65rem;align-items:center}.icon{width:2rem;height:2rem;background:#303030;border-radius:.6rem;display:grid;place-items:center;color:#cccccc;font-size:1.1rem}h2{font-size:1.15rem;letter-spacing:-.035em;font-weight:550}.sub{font-size:.47rem;color:var(--muted)}.pill{font-size:.48rem;border-radius:2rem;padding:.3rem .55rem;background:#dddddd17;color:var(--green);white-space:nowrap}.pill.warn{color:var(--amber);background:#e5ae5119}.pill.offline{color:var(--red);background:#ef806c19}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.45rem}.tile{background:var(--inset);border-radius:.65rem;padding:.65rem .7rem}.value{font-size:1.7rem;letter-spacing:-.055em;line-height:1.1;font-weight:500;white-space:nowrap}.value small{font-size:.6rem;letter-spacing:0;color:#b8b8b8;margin-left:.13rem}.label{font-size:.48rem;color:var(--muted);margin-top:.25rem}.section{background:var(--inset);border-radius:.7rem;padding:.7rem .8rem;min-height:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}h3{font-weight:500;font-size:.62rem}.hint{font-size:.43rem;color:var(--muted)}.activity{flex:1;min-height:4.5rem;display:flex;flex-direction:column}.plot{position:relative;flex:1;min-height:1.8rem;margin:.2rem 0}.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.gridline{stroke:#ffffff09;stroke-width:1;vector-effect:non-scaling-stroke}.line{fill:none;stroke-width:2.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}.legend{display:flex;gap:.65rem;font-size:.42rem;color:var(--muted)}.legend span{display:flex;gap:.25rem;align-items:center}.legend i{height:.22rem;width:.22rem;border-radius:.06rem;background:var(--green)}.legend .secondary{background:#919191}.axis{display:flex;justify-content:space-between;font-size:.37rem;color:#888888}.cores{display:flex;gap:.2rem;margin-top:.5rem}.cores span{flex:1;height:.32rem;background:#ffffff0c;border-radius:.09rem}.core-label{display:flex;justify-content:space-between;margin-top:.3rem;font-size:.4rem;color:var(--muted)}.feature{min-height:4.5rem}.feature-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}.feature-stats .value{font-size:1.15rem}.bar{height:.26rem;background:#ffffff0d;border-radius:.3rem;overflow:hidden;margin:.5rem 0 .25rem}.bar span{display:block;height:100%;background:var(--green);border-radius:inherit;transition:width 1s}.row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:.48rem;padding:.2rem 0}.row .key{color:var(--muted)}.row strong{font-weight:450}.alert{color:var(--amber)}.feature .description{font-size:.48rem;color:var(--muted);margin-top:.3rem}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}.bottom .value{font-size:1.15rem}.bottom .row{font-size:.43rem}.services{display:flex;flex-wrap:wrap;gap:.35rem .8rem;font-size:.45rem;border-top:1px solid #ffffff0b;padding-top:.6rem;margin-top:auto}.service{display:flex;gap:.3rem;align-items:center;color:var(--muted)}.dot{height:.22rem;width:.22rem;border-radius:50%;background:var(--green)}.dot.warn{background:var(--amber)}.dot.offline{background:var(--red)}.machine-footer{display:flex;justify-content:space-between;font-size:.4rem;color:var(--muted)}footer{display:flex;justify-content:space-between;color:#929292;font-size:.42rem}.offline-body{flex:1;display:grid;place-content:center;text-align:center;color:var(--muted);gap:.5rem}.offline-body strong{color:var(--text);font-weight:450}[hidden]{display:none!important}@media(max-height:800px){main{padding:.8rem;gap:.6rem}.machine{padding:.7rem;gap:.4rem}.tile{padding:.45rem}.section{padding:.45rem .6rem}.value{font-size:1.35rem}.label{font-size:.42rem}.machine-head .sub{font-size:.4rem}.feature{min-height:0}.activity{min-height:3rem}}
</style></head><body><main><header><div><div class="eyebrow">Homelab / system overview</div><h1>Machines</h1></div><div><div class="clock" id="clock">—</div><div class="date" id="date">—</div></div></header><section class="machines" id="machines" aria-label="All machines"></section><footer><span id="summary">Connecting to your machines…</span><span>Updates every 2 seconds · no interaction needed</span></footer></main>
<template id="machine-template"><article class="machine"><div class="machine-head"><div class="identity"><div class="icon">▥</div><div><h2 data-id="name"></h2><div class="sub" data-id="subtitle"></div></div></div><span class="pill" data-id="state">Connecting</span></div><div class="offline-body" data-id="offline" hidden><strong>No current telemetry</strong><span class="sub">This machine will reappear automatically when it reconnects.</span></div><div class="tiles" data-live><div class="tile"><div class="value" data-id="cpu">—</div><div class="label">CPU load</div></div><div class="tile"><div class="value" data-id="memory">—</div><div class="label">Memory used</div></div><div class="tile"><div class="value" data-id="temp">—</div><div class="label">CPU temperature</div></div><div class="tile"><div class="value" data-id="free">—</div><div class="label">System disk free</div></div></div><section class="section activity" data-live><div class="section-head"><h3>Activity</h3><div class="legend"><span><i></i>CPU</span><span><i class="secondary"></i><span data-id="second-label">GPU</span></span></div></div><div class="plot"><svg data-id="chart" viewBox="0 0 600 100" preserveAspectRatio="none" aria-label="CPU and GPU or memory percentage history"></svg></div><div class="axis"><span>2 min ago</span><span>Utilization · 0–100%</span><span>Now</span></div><div class="cores" data-id="cores"></div><div class="core-label"><span>Thread activity</span><span data-id="threads"></span></div></section><section class="section feature" data-id="feature" data-live></section><div class="bottom" data-live><section class="section"><div class="section-head"><h3>Storage</h3><span class="hint" data-id="disk-device"></span></div><div class="row"><span class="key">Used / total</span><strong data-id="disk-used"></strong></div><div class="bar"><span data-id="disk-bar"></span></div><div class="row"><span class="key">Read / write</span><strong data-id="disk-io"></strong></div><div class="row"><span class="key">RAM available</span><strong data-id="available"></strong></div></section><section class="section"><div class="section-head"><h3>Network</h3><span class="hint" data-id="link"></span></div><div class="row"><span class="key">↓ Receive</span><strong data-id="rx"></strong></div><div class="row"><span class="key">↑ Transmit</span><strong data-id="tx"></strong></div><div class="row"><span class="key">Total received</span><strong data-id="received"></strong></div><div class="row"><span class="key">LAN address</span><strong data-id="ip"></strong></div></section></div><div class="services" data-id="services" data-live></div><div class="machine-footer" data-live><span data-id="uptime"></span><span data-id="updated"></span></div></article></template>
<script>
const $=id=>document.getElementById(id),hosts={},histories={};
const finite=n=>typeof n==='number'&&Number.isFinite(n),fmt=(n,d=0)=>finite(n)?n.toFixed(d):'—',gib=n=>n/1073741824;
function bytes(n){if(!finite(n))return '—';let i=0;const u=['B','KiB','MiB','GiB','TiB'];while(n>=1024&&i<4){n/=1024;i++;}return fmt(n,i?1:0)+' '+u[i];}
function metric(el,n,unit){el.replaceChildren(document.createTextNode(n));const small=document.createElement('small');small.textContent=unit;el.appendChild(small);}
function textRow(parent,label,value,warning=false){const row=document.createElement('div');row.className='row';const key=document.createElement('span');key.className='key';key.textContent=label;const strong=document.createElement('strong');strong.textContent=value;if(warning)strong.className='alert';row.append(key,strong);parent.appendChild(row);}
function health(parent,label,ok){const el=document.createElement('span');el.className='service';const dot=document.createElement('i');dot.className='dot'+(ok?'':' warn');el.append(dot,document.createTextNode(label));parent.appendChild(el);}
function render(name,host){
 if(!hosts[name]){const el=$('machine-template').content.firstElementChild.cloneNode(true);$('machines').appendChild(el);hosts[name]={el,fields:Object.fromEntries([...el.querySelectorAll('[data-id]')].map(x=>[x.dataset.id,x]))};histories[name]=[];}
 const {el,fields:f}=hosts[name],d=host.metrics,online=host.online&&d&&Date.now()/1000-d.timestamp<10;
 f.name.textContent=name;f.subtitle.textContent=name==='lake'?'Storage & services':'Compute & local inference';f.offline.hidden=online;el.querySelectorAll('[data-live]').forEach(x=>x.hidden=!online);
 f.state.textContent=online?'● Online':'● Offline';f.state.className='pill'+(online?'':' offline');
 if(!online)return;
 const sensors=d.sensors,warning=sensors&&(sensors.status||(sensors.pool&&!sensors.pool.includes('ONLINE')));
 if(warning){f.state.textContent='● Needs attention';f.state.className='pill warn';}
 f.subtitle.textContent=d.cpu_name.replace('AMD ','').replace(' w/ Radeon 780M Graphics','');
 metric(f.cpu,fmt(d.cpu.usage,1),'%');metric(f.memory,fmt(gib(d.memory.used),1),'GiB');metric(f.temp,fmt(d.cpu.temperature),'°C');metric(f.free,fmt(gib(d.disk.free)),'GiB');
 let history=histories[name];if(history.at(-1)?.timestamp!==d.timestamp){history.push({timestamp:d.timestamp,cpu:d.cpu.usage,second:d.gpu?.usage??d.memory.percent});while(history.length&&d.timestamp-history[0].timestamp>120)history.shift();}
 f['second-label'].textContent=d.gpu?'GPU':'Memory';let chart=[0,25,50,75,100].map(y=>`<path class="gridline" d="M0 ${y}H600"/>`).join('');
 for(const [key,color]of [['cpu','#dddddd'],['second','#919191']]){let path='',previous=null;for(const point of history){const n=point[key];if(!finite(n)){previous=null;continue;}const x=600-(d.timestamp-point.timestamp)*5,y=98-Math.max(0,Math.min(100,n))*.96;path+=`${previous!==null&&point.timestamp-previous<10?'L':'M'}${x.toFixed(1)},${y.toFixed(1)} `;previous=point.timestamp;}chart+=`<path class="line" stroke="${color}" d="${path}"/>`;}
 f.chart.innerHTML=chart;f.cores.replaceChildren();for(const n of d.cpu.cores){const bar=document.createElement('span');bar.style.background=n>80?'#e5ae51':n>40?'#dddddd':n>10?'#777777':'#454545';f.cores.appendChild(bar);}f.threads.textContent=d.cpu.cores.length+' threads · '+fmt(d.cpu.frequency/1000,2)+' GHz';
 f.feature.replaceChildren();const heading=document.createElement('div');heading.className='section-head';const h=document.createElement('h3');h.textContent=sensors?'Storage & service health':'Graphics';heading.appendChild(h);f.feature.appendChild(heading);
 if(sensors){for(const key of ['status','pool','capacity','temperatures','drives','services','cache']){if(!sensors[key])continue;const warning=(key==='pool'&&!sensors[key].includes('ONLINE'))||key==='status'||(key==='capacity'&&parseInt(sensors[key].replace(/[^0-9]/g,''))>=90);textRow(f.feature,'',sensors[key],warning);}}
 else if(d.gpu){const gpu=d.gpu;const title=document.createElement('span');title.className='hint';title.textContent=gpu.name.replace('NVIDIA GeForce ','');heading.appendChild(title);const stats=document.createElement('div');stats.className='feature-stats';for(const[label,value,unit]of [['Utilization',fmt(gpu.usage),'%'],['Temperature',fmt(gpu.temperature),'°C'],['Power',fmt(gpu.power),'W']]){const stat=document.createElement('div'),v=document.createElement('div');v.className='value';metric(v,value,unit);const l=document.createElement('div');l.className='label';l.textContent=label;stat.append(v,l);stats.appendChild(stat);}f.feature.appendChild(stats);textRow(f.feature,'Video memory',finite(gpu.memory_used)&&gpu.memory_total>0?fmt(gpu.memory_used/1024,1)+' / '+fmt(gpu.memory_total/1024,1)+' GiB':'Unavailable');textRow(f.feature,'Core clock / fan',fmt(gpu.core_clock)+' MHz / '+fmt(gpu.fan)+'%');}
 else textRow(f.feature,'GPU telemetry','Unavailable');
 f['disk-device'].textContent=d.disk.device;f['disk-used'].textContent=fmt(gib(d.disk.used))+' / '+fmt(gib(d.disk.total))+' GiB';f['disk-bar'].style.width=d.disk.percent+'%';f['disk-io'].textContent=bytes(d.disk.read)+'/s · '+bytes(d.disk.write)+'/s';f.available.textContent=bytes(d.memory.available);
 f.rx.textContent=bytes(d.network.download)+'/s';f.tx.textContent=bytes(d.network.upload)+'/s';f.received.textContent=bytes(d.network.received);f.ip.textContent=d.network.address;f.link.textContent=d.network.connected?fmt(d.network.speed/1000,1)+' GbE':'Link down';
 f.services.replaceChildren();if(sensors){health(f.services,sensors.pool?.includes('ONLINE')?'Storage pool healthy':'Storage pool needs attention',sensors.pool?.includes('ONLINE'));health(f.services,'Telemetry connected',true);}else{health(f.services,'Inkling '+(d.services.inference?'online':'unavailable'),d.services.inference);health(f.services,'T3 Code '+(d.services.workspace?'online':'unavailable'),d.services.workspace);}
 const minutes=Math.floor(d.uptime/60),hours=Math.floor(minutes/60);f.uptime.textContent='Up '+Math.floor(hours/24)+'d '+hours%24+'h '+minutes%60+'m';f.updated.textContent='Updated '+new Date(d.timestamp*1000).toLocaleTimeString('en-GB');
}
async function refresh(){try{const response=await fetch('/api/fleet',{cache:'no-store',signal:AbortSignal.timeout(3000)});if(!response.ok)throw Error('Telemetry unavailable');const data=await response.json();for(const[name,host]of Object.entries(data))render(name,host);const online=Object.values(data).filter(h=>h.online&&h.metrics&&Date.now()/1000-h.metrics.timestamp<10).length;$('summary').textContent=online+' of '+Object.keys(data).length+' machines connected · all machines shown';}catch{for(const name of Object.keys(hosts))render(name,{online:false});$('summary').textContent='Telemetry unavailable · reconnecting automatically';}setTimeout(refresh,2000);}
function clock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});$('date').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}clock();setInterval(clock,1000);refresh();
</script></body></html>

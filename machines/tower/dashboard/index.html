<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homelab · Machines</title>
<style>
:root{color-scheme:dark;font:clamp(13px,.69vw,24px)/1.35 Inter,sans-serif;--bg:#111;--panel:#1e1e1e;--inset:#292929;--muted:#a3a3a3;--text:#eee;--blue:#89b9ed;--purple:#b9a2e8;--orange:#e7b57a;--warn:#e5ae51}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;overflow:hidden}main{height:100vh;padding:1rem 1.25rem .7rem;display:flex;flex-direction:column;gap:.7rem}header,.row,.head,.legend,.offline-hosts{display:flex;justify-content:space-between;align-items:center;gap:.5rem}h1,h2,h3,p{margin:0}h1{font-size:1.3rem;font-weight:500;letter-spacing:-.04em}h2{font-size:1rem;font-weight:500;letter-spacing:-.03em}h3{font-size:.6rem;font-weight:500}.eyebrow{font-size:.4rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.2rem}.clock{font-size:.8rem;color:#ccc}.wall{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1.1fr);gap:.75rem}.machines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:.65rem;min-height:0}.machine,.zfs{border-radius:.85rem;background:var(--panel);border:1px solid #ffffff08;padding:.75rem;display:flex;flex-direction:column;gap:.5rem;min-width:0;min-height:0}.subtitle,.hint,.label,.legend{font-size:.4rem;color:var(--muted)}.subtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:15rem}.pill{font-size:.4rem;border-radius:2rem;background:#ffffff0a;padding:.2rem .4rem;white-space:nowrap;color:#d0d0d0}.warn{color:var(--warn)!important}.bad{color:#ed958b!important}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem}.tile{padding:.45rem .4rem;background:var(--inset);border-radius:.4rem}.value{font-size:1.15rem;line-height:1.1;letter-spacing:-.045em}.value small{font-size:.43rem;color:#bbb;margin-left:.08rem;letter-spacing:0}.label{margin-top:.2rem;font-size:.36rem}.graphs{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;flex:1;min-height:3.2rem}.chart-box{background:var(--inset);border-radius:.45rem;padding:.4rem;display:flex;flex-direction:column;min-height:0;gap:.2rem}.legend{justify-content:flex-start;gap:.4rem;font-size:.35rem}.legend i{display:inline-block;width:.2rem;height:.2rem;border-radius:.04rem;margin-right:.15rem;background:var(--blue)}.legend .purple{background:var(--purple)}.legend .orange{background:var(--orange)}.plot{flex:1;min-height:1.1rem;position:relative}.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.line{fill:none;stroke-width:1.8;stroke-linejoin:round;vector-effect:non-scaling-stroke}.gridline{stroke:#ffffff0a;stroke-width:1;vector-effect:non-scaling-stroke}.network{flex:.8;min-height:2.7rem}.row{font-size:.4rem}.row .key{color:var(--muted)}.row strong{font-weight:450;text-align:right}.details{display:flex;flex-direction:column;gap:.15rem}.bar{height:.2rem;background:#ffffff0b;border-radius:.3rem;overflow:hidden;margin:.2rem 0}.bar span{display:block;height:100%;background:#9f9f9f;max-width:100%}.footer{display:flex;justify-content:space-between;gap:.3rem;color:#aaa;font-size:.35rem;margin-top:auto;border-top:1px solid #ffffff09;padding-top:.35rem}.offline-hosts{justify-content:flex-start;gap:.6rem}.offline-hosts .machine{padding:.35rem .65rem;flex-direction:row;align-items:center;gap:1rem}.offline-hosts h2{font-size:.6rem}.offline-hosts .subtitle{display:none}.offline-hosts .head{gap:.6rem}.section{padding:.6rem;background:var(--inset);border-radius:.5rem}.zfs{gap:.6rem}.zfs .tiles{grid-template-columns:1fr 1fr}.zfs .value{font-size:1.3rem}.zfs .row{font-size:.42rem;margin:.2rem 0}.zfs-table{width:100%;border-collapse:collapse;font-size:.4rem;table-layout:fixed}.zfs-table th{font-size:.35rem;color:var(--muted);text-align:left;font-weight:400;padding:.3rem .15rem;border-bottom:1px solid #ffffff12}.zfs-table td{padding:.35rem .15rem;border-bottom:1px solid #ffffff06;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.zfs-table th:nth-child(n+2),.zfs-table td:nth-child(n+2){text-align:right}.zfs-table .device{width:36%}.zfs-table .state{width:28%}.zfs .section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem}.zfs .note{font-size:.36rem;color:var(--muted);margin-top:.3rem;line-height:1.6}.zfs-body{display:flex;flex-direction:column;gap:.55rem;min-height:0}.zfs .progress span{background:var(--purple)}.unavailable{display:grid;place-content:center;flex:1;color:#aaa;font-size:.42rem;text-align:center}.bottomline{display:flex;justify-content:space-between;align-items:center;color:#999;font-size:.4rem}.health-line{font-size:.38rem;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}[hidden]{display:none!important}@media(max-height:850px){main{padding:.6rem;gap:.4rem}.machine,.zfs{padding:.5rem;gap:.3rem}.zfs-table td{padding:.2rem .1rem}.graphs{min-height:2rem}.network{min-height:2rem}.tile{padding:.3rem}.label{font-size:.33rem}.zfs .section{padding:.4rem}}
</style></head><body><main><header><div><div class="eyebrow">Homelab / live system overview</div><h1>Machines</h1></div><div class="clock" id="clock"></div></header><div class="wall"><section class="machines" id="machines"></section><aside class="zfs"><div class="head"><h2>Lake · ZFS</h2><span class="pill" id="zfs-state">Connecting</span></div><div class="zfs-body" id="zfs-body"></div></aside></div><div class="bottomline"><div class="offline-hosts" id="offline-hosts"></div><span id="summary">Connecting…</span><span>2-second telemetry · 10-second ZFS · no interaction required</span></div></main>
<template id="host"><article class="machine"><div class="head"><div><h2 data-id="name"></h2><div class="subtitle" data-id="subtitle"></div></div><span class="pill" data-id="state"></span></div><div class="tiles" data-live><div class="tile"><div class="value" data-id="cpu"></div><div class="label">CPU load</div></div><div class="tile"><div class="value" data-id="ram"></div><div class="label">Memory used</div></div><div class="tile"><div class="value" data-id="temp"></div><div class="label">CPU temp</div></div><div class="tile"><div class="value" data-id="disk"></div><div class="label">Disk free</div></div></div><div class="graphs" data-live><div class="chart-box"><div class="legend"><span><i></i>CPU · 0–100%</span></div><div class="plot"><svg data-id="cpu-chart" viewBox="0 0 600 100" preserveAspectRatio="none"></svg></div></div><div class="chart-box"><div class="legend"><span><i class="purple"></i>GPU · 0–100%</span></div><div class="plot"><svg data-id="gpu-chart" viewBox="0 0 600 100" preserveAspectRatio="none"></svg><div class="unavailable" data-id="gpu-unavailable" hidden>Telemetry unavailable</div></div></div></div><div class="health-line" data-id="gpu-stats" data-live></div><div class="chart-box network" data-live><div class="head"><div class="legend"><span><i></i>↓ Receive</span><span><i class="orange"></i>↑ Transmit</span></div><span class="hint" data-id="net-scale"></span></div><div class="plot"><svg data-id="net-chart" viewBox="0 0 600 100" preserveAspectRatio="none"></svg></div><div class="row"><span data-id="net-rates"></span><span class="hint">Last 2 min</span></div></div><div class="details" data-live><div class="row"><span class="key">System disk</span><strong data-id="disk-used"></strong></div><div class="bar"><span data-id="disk-bar"></span></div><div class="row"><span class="key">Disk read / write</span><strong data-id="disk-io"></strong></div><div class="row"><span class="key">RAM available / total</span><strong data-id="ram-total"></strong></div></div><div class="health-line" data-id="services" data-live></div><div class="footer" data-live><span data-id="uptime"></span><span data-id="ip"></span><span data-id="updated"></span></div></article></template>
<script>
const $=id=>document.getElementById(id),hosts={},histories={},order=['tower','lake','nova','gateway','pulsar','comet','gilbert','void'];
const finite=n=>typeof n==='number'&&Number.isFinite(n),fmt=(n,d=0)=>finite(n)?n.toFixed(d):'—',gib=n=>n/1073741824;
function bytes(n){if(!finite(n))return '—';let i=0;const units=['B','KiB','MiB','GiB','TiB'];while(n>=1024&&i<4){n/=1024;i++;}return fmt(n,i?1:0)+' '+units[i];}
function metric(el,n,unit){el.replaceChildren(document.createTextNode(n));const small=document.createElement('small');small.textContent=unit;el.appendChild(small);}
function row(parent,label,value,warn=false){const r=document.createElement('div');r.className='row';const key=document.createElement('span');key.className='key';key.textContent=label;const v=document.createElement('strong');v.textContent=value;if(warn)v.className='warn';r.append(key,v);parent.appendChild(r);}
function graph(el,history,keys,colors,max=100){let svg=[0,50,100].map(y=>`<path class="gridline" d="M0 ${y}H600"/>`).join('');for(let k=0;k<keys.length;k++){let path='',prev=null;for(const p of history){const n=p[keys[k]];if(!finite(n)){prev=null;continue;}const x=600-(history.at(-1).t-p.t)*5,y=98-Math.max(0,Math.min(1,n/max))*96;path+=`${prev!==null&&p.t-prev<10?'L':'M'}${x.toFixed(1)},${y.toFixed(1)} `;prev=p.t;}svg+=`<path class="line" stroke="${colors[k]}" d="${path}"/>`;}el.innerHTML=svg;}
function renderHost(name,host){if(!hosts[name]){const el=$('host').content.firstElementChild.cloneNode(true);hosts[name]={el,f:Object.fromEntries([...el.querySelectorAll('[data-id]')].map(x=>[x.dataset.id,x]))};histories[name]=[];}
 const {el,f}=hosts[name],d=host.metrics,online=host.online&&d&&Math.abs(Date.now()/1000-d.timestamp)<12;const container=$(online?'machines':'offline-hosts');container.appendChild(el);f.name.textContent=name;f.state.textContent=online?'● Online':'● Offline';f.state.className='pill'+(online?'':' warn');el.querySelectorAll('[data-live]').forEach(x=>x.hidden=!online);if(!online)return;
 f.subtitle.textContent=d.cpu_name;metric(f.cpu,fmt(d.cpu.usage,1),'%');metric(f.ram,fmt(gib(d.memory.used),1),'GiB');metric(f.temp,fmt(d.cpu.temperature),finite(d.cpu.temperature)?'°C':'');metric(f.disk,fmt(gib(d.disk.free)),'GiB');
 const history=histories[name];if(history.at(-1)?.t!==d.timestamp){history.push({t:d.timestamp,cpu:d.cpu.usage,gpu:d.gpu?.usage??null,rx:d.network.download,tx:d.network.upload});while(history.length&&d.timestamp-history[0].t>120)history.shift();}
 graph(f['cpu-chart'],history,['cpu'],['#89b9ed']);graph(f['gpu-chart'],history,['gpu'],['#b9a2e8']);f['gpu-unavailable'].hidden=finite(d.gpu?.usage);const max=Math.max(1024,...history.flatMap(p=>[p.rx,p.tx]).filter(finite));graph(f['net-chart'],history,['rx','tx'],['#89b9ed','#e7b57a'],max);f['net-scale'].textContent=bytes(max)+'/s max';f['net-rates'].textContent='↓ '+bytes(d.network.download)+'/s   ↑ '+bytes(d.network.upload)+'/s';
 if(d.gpu){const g=d.gpu;f['gpu-stats'].textContent=g.name.replace('NVIDIA GeForce ','')+' · '+fmt(g.usage)+'% · '+fmt(g.temperature)+'°C'+(finite(g.power)?' · '+fmt(g.power)+' W':'')+' · '+(g.memory_label||'VRAM')+' '+fmt(g.memory_used/1024,1)+' / '+fmt(g.memory_total/1024,1)+' GiB';}else f['gpu-stats'].textContent=d.os==='darwin'?'Apple GPU telemetry not exposed by this collector':'No supported GPU telemetry';
 f['disk-used'].textContent=bytes(d.disk.used)+' / '+bytes(d.disk.total);f['disk-bar'].style.width=d.disk.percent+'%';f['disk-io'].textContent=bytes(d.disk.read)+'/s · '+bytes(d.disk.write)+'/s';f['ram-total'].textContent=bytes(d.memory.available)+' / '+bytes(d.memory.total);
 f.services.textContent=name==='tower'?'Inkling '+(d.services.inference?'online':'unavailable')+' · T3 Code '+(d.services.workspace?'online':'unavailable'):name==='lake'?(d.sensors?.services||'Lake services unavailable'):'Live hardware telemetry';const minutes=Math.floor(d.uptime/60);f.uptime.textContent='Up '+Math.floor(minutes/1440)+'d '+Math.floor(minutes/60)%24+'h';f.ip.textContent=d.network.address;f.updated.textContent=new Date(d.timestamp*1000).toLocaleTimeString('en-GB');}
function table(parent,headers,rows,widths=[]){const t=document.createElement('table');t.className='zfs-table';const head=t.createTHead().insertRow();headers.forEach((h,i)=>{const th=document.createElement('th');th.textContent=h;if(widths[i])th.style.width=widths[i];head.appendChild(th);});const body=t.createTBody();for(const values of rows){const r=body.insertRow();values.forEach(v=>{const cell=r.insertCell();cell.textContent=String(v??'—');if(['DEGRADED','CANT_OPEN','UNAVAIL','FAULTED'].includes(v))cell.className='warn';});}parent.appendChild(t);}
function section(title){const s=document.createElement('section');s.className='section';const h=document.createElement('h3');h.textContent=title;s.appendChild(h);$('zfs-body').appendChild(s);return s;}
function renderZFS(host){const z=host?.metrics?.zfs;const body=$('zfs-body');body.replaceChildren();const fresh=host?.online&&z?.available&&Math.abs(Date.now()/1000-z.timestamp)<35;if(!fresh){$('zfs-state').textContent='Unavailable';$('zfs-state').className='pill warn';const s=section('Waiting for live ZFS data');row(s,'Status',z?.error||'Lake is offline or readings are stale');return;}
 $('zfs-state').textContent=z.name+' · '+z.state;$('zfs-state').className='pill'+(z.state==='ONLINE'?'':' warn');
 const cap=section('Capacity');const used=z.raw_used/z.raw_total*100;row(cap,'Raw pool allocation',bytes(z.raw_used)+' / '+bytes(z.raw_total),used>=90);const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('span');fill.style.width=used+'%';fill.style.background=used>=90?'#e5ae51':'#aaa';bar.appendChild(fill);cap.appendChild(bar);row(cap,'Raw free',bytes(z.raw_total-z.raw_used)+' · '+fmt(used)+'% allocated');const root=z.datasets?.find(d=>d.name===z.name);if(root){row(cap,'Usable data used',bytes(root.used));row(cap,'Usable available',bytes(root.available));}
 const scan=section('Scrub / rebuild');const status=z.scan||{};const active=status.state==='SCANNING';row(scan,'Operation',(status.function||'None')+' · '+(status.state||'No scan'));if(active){row(scan,'Progress',fmt(z.scan_percent,2)+'%');const bar=document.createElement('div');bar.className='bar progress';const fill=document.createElement('span');fill.style.width=(z.scan_percent||0)+'%';bar.appendChild(fill);scan.appendChild(bar);row(scan,'Issued / total',bytes(status.issued)+' / '+bytes(status.to_examine));}else if(status.end_time){row(scan,'Last completed',new Date(status.end_time*1000).toLocaleString('en-GB'));}row(scan,'Scan errors',String(status.errors??'—'),status.errors>0);
 const health=section('Pool integrity');row(health,'Read / write / checksum',`${z.read_errors??'—'} / ${z.write_errors??'—'} / ${z.checksum_errors??'—'}`,z.read_errors+z.write_errors+z.checksum_errors>0);row(health,'Known data errors',String(z.data_errors??'—'),z.data_errors>0);
 const drives=section('Drive health');const sorted=[...(z.drives||[])].sort((a,b)=>(a.path||a.name).localeCompare(b.path||b.name));table(drives,['Drive','State','R','W','CRC'],sorted.map(d=>{const id=(d.path||d.name).replace('/dev/disk/by-id/','').replace('-part1','');return [id.slice(-12)+(d.missing?' (old)':d.replacing?' ↻':''),d.state,d.read_errors,d.write_errors,d.checksum_errors];}),['38%','29%','11%','11%','11%']);const note=document.createElement('p');note.className='note';note.textContent='R / W / CRC = read, write and checksum errors. ↻ replacement drive; old = removed member.';drives.appendChild(note);
 const datasets=section('Datasets');table(datasets,['Dataset','Used','Available'],(z.datasets||[]).map(d=>[d.name,bytes(d.used),bytes(d.available)]),['44%','28%','28%']);const note2=document.createElement('p');note2.className='note';note2.textContent='Available space is shared by datasets, not additive. Raw pool capacity includes parity and differs from usable capacity.';datasets.appendChild(note2);
 const s=host.metrics.sensors;if(s?.drives){const temps=section('Drive temperatures');const p=document.createElement('p');p.className='note';p.textContent=s.drives;temps.appendChild(p);}
}
async function refresh(){try{const r=await fetch('/api/fleet',{cache:'no-store',signal:AbortSignal.timeout(3500)});if(!r.ok)throw Error();const data=await r.json();for(const name of [...new Set([...order,...Object.keys(data)])]){if(data[name])renderHost(name,data[name]);}renderZFS(data.lake);const online=Object.values(data).filter(h=>h.online).length;$('summary').textContent=online+' / '+Object.keys(data).length+' machines online';}catch{for(const name of Object.keys(hosts))renderHost(name,{online:false});renderZFS(null);$('summary').textContent='Telemetry unavailable';}setTimeout(refresh,2000);}
function clock(){$('clock').textContent=new Date().toLocaleString('en-GB');}clock();setInterval(clock,1000);refresh();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homelab · Machines</title>
<style>
:root{color-scheme:dark;font:18px/1.35 Inter,sans-serif;--bg:#111;--panel:#1e1e1e;--inset:#292929;--text:#eee;--muted:#aaa;--gap:16px;--pad:24px;--radius:20px;--blue:#89b9ed;--purple:#b9a2e8;--orange:#e7b57a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;overflow:hidden}h1,h2,h3,p{margin:0}main{height:100vh;padding:28px 32px 20px;display:flex;flex-direction:column;gap:20px}header{display:flex;justify-content:space-between;align-items:center;min-height:64px}h1{font-size:36px;font-weight:500;letter-spacing:-1px}h2{font-size:30px;font-weight:500;letter-spacing:-.7px}h3{font-size:20px;font-weight:500}.eyebrow{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.clock{font-size:22px;color:#ccc}.wall{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px}.machines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:20px;min-height:0}.lake-host{min-height:0;display:flex}.lake-host>.machine{flex:1}.machine{padding:20px;border-radius:var(--radius);background:var(--panel);border:1px solid #ffffff08;display:grid;grid-template-rows:48px 82px minmax(100px,1fr) 68px 78px 22px 22px;gap:10px;min-height:0;min-width:0}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}.machine>.head{grid-row:1}.subtitle{font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:750px}.pill{font-size:16px;border-radius:30px;padding:6px 12px;background:#ffffff0a;color:#ccc;white-space:nowrap}.pill.online{color:#8ed6a0;background:#8ed6a015}.warn{color:#e5ae51!important}.bad{color:#ee958c!important}.tiles{grid-row:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{padding:10px 12px;background:var(--inset);border-radius:12px}.value{white-space:nowrap;font-size:32px;line-height:40px;letter-spacing:-1px}.value small{font-size:18px;color:#bbb;margin-left:3px;letter-spacing:0}.label{font-size:16px;line-height:20px;color:var(--muted)}.graphs{grid-row:3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-height:0}.chart-box{padding:12px;background:var(--inset);border-radius:12px;display:grid;grid-template-rows:22px minmax(0,1fr) 20px;gap:8px;min-width:0;min-height:0}.legend{display:flex;gap:8px;align-items:center;font-size:16px;color:var(--muted);white-space:nowrap}.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;background:var(--blue)}.legend .purple{background:var(--purple)}.legend .orange{background:var(--orange)}.plot{position:relative;min-height:0;grid-row:2}.plot svg{position:absolute;left:46px;top:3px;width:calc(100% - 46px);height:calc(100% - 28px);overflow:hidden}.network .plot svg{left:72px;width:calc(100% - 72px)}.y-axis{position:absolute;left:0;top:0;bottom:22px;display:flex;flex-direction:column;justify-content:space-between;color:#aaa;font-size:14px;line-height:15px}.x-axis{position:absolute;left:46px;right:0;bottom:0;display:flex;justify-content:space-between;color:#aaa;font-size:14px;line-height:18px}.network .x-axis{left:72px}.gpu-panel{grid-row:4;display:flex;flex-direction:column;gap:6px;min-width:0}.gpu-panel .row{font-size:17px}.gpu-panel .bar span{background:var(--purple)}.good{color:#8ed6a0}.read-rate{color:var(--blue)}.write-rate{color:var(--orange)}.busy-cell{background-image:linear-gradient(to right,#b9a2e81c var(--fill),transparent var(--fill));color:var(--purple)}.scan-progress{height:6px;background:#ffffff0b;border-radius:4px;overflow:hidden}.scan-progress span{display:block;height:100%;background:var(--purple)}.zfs-table .state-tag{font-size:14px;border-radius:5px;padding:2px 5px;background:#ffffff06}.line{fill:none;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}.gridline{stroke:#ffffff0a;stroke-width:1;vector-effect:non-scaling-stroke}.hint{font-size:14px;color:#999}.network .head{display:block}.network .head>.hint{display:none}.network>.row{grid-row:3;font-size:14px;white-space:nowrap}.network>.row>.hint{display:none}.unavailable{position:absolute;inset:0 0 22px 46px;display:grid;place-content:center;text-align:center;color:#999;font-size:15px}.health-line{font-size:16px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.health-line[data-id="gpu-stats"]{grid-row:4}.health-line[data-id="services"]{grid-row:6}.details,.compact-zfs{grid-row:5;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-height:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:17px;line-height:22px;min-width:0}.row .key{color:var(--muted);flex-shrink:0}.row strong{font-weight:450;text-align:right}.bar{height:5px;background:#ffffff0b;border-radius:4px;overflow:hidden;flex-shrink:0}.bar span{display:block;height:100%;max-width:100%;background:#999}.footer{grid-row:7;display:flex;justify-content:space-between;gap:8px;color:#999;font-size:15px;line-height:22px;border-top:1px solid #ffffff09;padding-top:4px}.lake-host .machine{grid-template-rows:48px 82px 190px 68px minmax(0,1fr) 22px 22px}.lake-host .details{display:none}.compact-zfs{padding:16px;background:var(--inset);border-radius:12px;justify-content:flex-start;gap:8px}.compact-zfs .row{font-size:18px;line-height:24px}.compact-zfs .section-heading{font-size:20px;font-weight:500;margin-top:8px;padding-top:8px;border-top:1px solid #ffffff12}.zfs-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:16px}.zfs-table th{font-size:15px;color:#aaa;text-align:left;font-weight:400;border-bottom:1px solid #ffffff14;padding:8px 4px}.zfs-table td{padding:6px 4px;border-bottom:1px solid #ffffff08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.zfs-table th:nth-child(n+2),.zfs-table td:nth-child(n+2){text-align:right}.note{font-size:15px;line-height:22px;color:#999}.bottomline{display:flex;justify-content:space-between;align-items:center;gap:24px;color:#999;font-size:17px;min-height:24px}.offline-hosts{display:flex;gap:12px;align-items:center;white-space:nowrap}.offline-hosts:before{content:"Offline:"}.offline-ho @media(max-height:1000px){main{padding:16px;gap:12px}.machine{padding:12px;gap:6px;grid-template-rows:40px 68px minmax(80px,1fr) 56px 64px 18px 18px}.lake-host .machine{grid-template-rows:40px 68px 160px 56px minmax(0,1fr) 18px 18px}.wall,.machines{gap:12px}.tile{padding:6px 10px}.value{font-size:28px;line-height:32px}.subtitle,.row,.label,.health-line{font-size:14px;line-height:18px}.zfs-table td,.zfs-table th{padding:4px}.compact-zfs{gap:6px}.compact-zfs .row{font-size:15px}.zfs-table{font-size:14px}}
</style></head><body><main><header><div><div class="eyebrow">Homelab / live system overview</div><h1>Machines</h1></div><div class="clock" id="clock"></div></header><div class="wall"><section class="machines" id="machines"></section><section class="lake-host" id="lake-host"></section></div><div class="bottomline"><div class="offline-hosts" id="offline-hosts"></div><span id="gateway-status">Gateway · connecting</span><span id="summary">Connecting…</span><span>Live · refreshes automatically</span></div></main>
<template id="host"><article class="machine"><div class="head"><div><h2 data-id="name"></h2><div class="subtitle" data-id="subtitle"></div></div><span class="pill" data-id="state"></span></div><div class="tiles" data-live><div class="tile"><div class="value" data-id="cpu"></div><div class="label">CPU load</div></div><div class="tile"><div class="value" data-id="ram"></div><div class="label">Memory used</div></div><div class="tile"><div class="value" data-id="temp"></div><div class="label">CPU temp</div></div><div class="tile"><div class="value" data-id="disk"></div><div class="label">Disk used</div></div></div><div class="graphs" data-live><div class="chart-box"><div class="legend"><span><i></i>CPU · 0–100%</span></div><div class="plot"><svg data-id="cpu-chart" viewBox="0 0 600 100" preserveAspectRatio="none"></svg></div></div><div class="chart-box"><div class="legend"><span><i class="purple"></i>GPU · 0–100%</span></div><div class="plot"><svg data-id="gpu-chart" viewBox="0 0 600 100" preserveAspectRatio="none"></svg><div class="unavailable" data-id="gpu-unavailable" hidden>Telemetry unavailable</div></div></div></div><div class="gpu-panel" data-live><div class="health-line" data-id="gpu-stats"></div><div class="row"><span class="key" data-id="gpu-memory-label">GPU memory</span><strong data-id="gpu-memory"></strong></div><div class="bar" data-id="gpu-memory-track"><span data-id="gpu-memory-bar"></span></div></div><div class="chart-box network" data-live><div class="head"><div class="legend"><span><i></i>↓ Receive</span><span><i class="orange"></i>↑ Transmit</span></div><span class="hint" data-id="net-scale"></span></div><div class="plot"><svg data-id="net-chart" viewBox="0 0 600 100" preserveAspectRatio="none"></svg></div><div class="row"><span data-id="net-rates"></span><span class="hint">Last 2 min</span></div></div><div class="details" data-live><div class="row"><span class="key">Disk space</span><strong data-id="disk-used"></strong></div><div class="bar"><span data-id="disk-bar"></span></div><div class="row"><span class="key">Disk read / write</span><strong data-id="disk-io"></strong></div><div class="row"><span class="key">Disk IOPS</span><strong data-id="disk-iops"></strong></div></div><div class="compact-zfs" data-id="zfs" data-live hidden></div><div class="health-line" data-id="services" data-live></div><div class="footer" data-live><span data-id="uptime"></span><span data-id="ip"></span><span data-id="updated"></span></div></article></template>
<script>
const $=id=>document.getElementById(id),hosts={},histories={},order=['tower','lake','nova','gateway','pulsar','comet','gilbert','void'];
const finite=n=>typeof n==='number'&&Number.isFinite(n),fmt=(n,d=0)=>finite(n)?n.toFixed(d):'—',gib=n=>n/1073741824;
function bytes(n){if(!finite(n))return '—';let i=0;const units=['B','KiB','MiB','GiB','TiB'];while(n>=1024&&i<4){n/=1024;i++;}return fmt(n,i?1:0)+' '+units[i];}
function metric(el,n,unit){el.replaceChildren(document.createTextNode(n));const small=document.createElement('small');small.textContent=unit;el.appendChild(small);}
function row(parent,label,value,warn=false){const r=document.createElement('div');r.className='row';const key=document.createElement('span');key.className='key';key.textContent=label;const v=document.createElement('strong');v.textContent=value;if(warn){v.className='warn';key.classList.add('warn');}r.append(key,v);parent.appendChild(r);}
function graph(el,history,keys,colors,max=100){const ticks=el.parentElement.querySelector('.y-axis').children;const network=keys.includes('rx');let scale=1,unit='B/s';if(network){if(max>=1048576){scale=1048576;unit='MiB/s';}else if(max>=1024){scale=1024;unit='KiB/s';}}[max,max/2,0].forEach((n,i)=>ticks[i].textContent=network?fmt(n/scale,n===0||n/scale>=10?0:1)+' '+unit:fmt(n)+'%');let svg=[0,50,100].map(y=>`<path class="gridline" d="M0 ${y}H600"/>`).join('');for(let k=0;k<keys.length;k++){let path='',prev=null;for(const p of history){const n=p[keys[k]];if(!finite(n)){prev=null;continue;}const x=600-(history.at(-1).t-p.t)*5,y=98-Math.max(0,Math.min(1,n/max))*96;path+=`${prev!==null&&p.t-prev<10?'L':'M'}${x.toFixed(1)},${y.toFixed(1)} `;prev=p.t;}svg+=`<path class="line" stroke="${colors[k]}" d="${path}"/>`;}el.innerHTML=svg;}
function renderHost(name,host){if(name==='gateway'){const d=host.metrics,online=host.online&&d&&Math.abs(Date.now()/1000-d.timestamp)<12;const el=$('gateway-status');el.className=online?'online':'';el.textContent=online?'● Gateway online · CPU '+fmt(d.cpu.usage,1)+'% · RAM '+bytes(d.memory.used)+' · Free '+bytes(d.disk.free):'Gateway · offline';return;}if(!hosts[name]){const el=$('host').content.firstElementChild.cloneNode(true);el.querySelector('.graphs').appendChild(el.querySelector('.network'));for(const plot of el.querySelectorAll('.plot')){const y=document.createElement('div');y.className='y-axis';y.innerHTML='<span>100%</span><span>50%</span><span>0%</span>';const x=document.createElement('div');x.className='x-axis';x.innerHTML='<span>−2 min</span><span>−1 min</span><span>Now</span>';plot.append(y,x);}hosts[name]={el,f:Object.fromEntries([...el.querySelectorAll('[data-id]')].map(x=>[x.dataset.id,x]))};histories[name]=[];}
 const {el,f}=hosts[name],d=host.metrics,online=host.online&&d&&Math.abs(Date.now()/1000-d.timestamp)<12;const container=$(online?(name==='lake'?'lake-host':'machines'):'offline-hosts');container.appendChild(el);f.name.textContent=name;f.state.textContent=online?'● Online':'● Offline';f.state.className='pill'+(online?' online':' warn');el.querySelectorAll('[data-live]').forEach(x=>x.hidden=!online);if(!online)return;
 f.subtitle.textContent=d.cpu_name;metric(f.cpu,fmt(d.cpu.usage,1),'%');metric(f.ram,fmt(gib(d.memory.used),1),'/ '+fmt(gib(d.memory.total),1)+' GiB');metric(f.temp,fmt(d.cpu.temperature),finite(d.cpu.temperature)?'°C':'');metric(f.disk,fmt(gib(d.disk.used)), '/ '+fmt(gib(d.disk.total))+' GiB');
 const history=histories[name];if(history.at(-1)?.t!==d.timestamp){history.push({t:d.timestamp,cpu:d.cpu.usage,gpu:d.gpu?.usage??null,rx:d.network.download,tx:d.network.upload});while(history.length&&d.timestamp-history[0].t>120)history.shift();}
 graph(f['cpu-chart'],history,['cpu'],['#89b9ed']);graph(f['gpu-chart'],history,['gpu'],['#b9a2e8']);f['gpu-unavailable'].hidden=finite(d.gpu?.usage);f['gpu-unavailable'].textContent=d.gpu?.status==='absent'?'No hardware GPU':(d.gpu?.reason||'GPU readings unavailable');const max=Math.max(1024,...history.flatMap(p=>[p.rx,p.tx]).filter(finite));graph(f['net-chart'],history,['rx','tx'],['#89b9ed','#e7b57a'],max);f['net-scale'].textContent=bytes(max)+'/s max';f['net-rates'].textContent='↓ '+bytes(d.network.download)+'/s   ↑ '+bytes(d.network.upload)+'/s';
 const g=d.gpu;if(g){const parts=[g.name.replace('NVIDIA GeForce ','')];if(finite(g.usage))parts.push(fmt(g.usage)+'%');if(finite(g.temperature))parts.push(fmt(g.temperature)+'°C');if(finite(g.power))parts.push(fmt(g.power)+' W');if(finite(g.core_clock))parts.push(fmt(g.core_clock)+' MHz');if(g.reason)parts.push(g.reason);f['gpu-stats'].textContent=parts.join(' · ');}else f['gpu-stats'].textContent='GPU inventory unavailable';
 const hasMemory=finite(g?.memory_used)&&finite(g?.memory_total)&&g.memory_total>0;f['gpu-memory-label'].textContent=g?.kind==='discrete'?'VRAM used':g?.memory_label==='Reserved UMA'?'Reserved GPU memory':'GPU shared memory';f['gpu-memory'].textContent=hasMemory?fmt(g.memory_used/1024,1)+' / '+fmt(g.memory_total/1024,1)+' GiB':g?.status==='absent'?'No hardware GPU':g?.kind==='integrated'?'Shared system RAM · usage unavailable':'Reading unavailable';f['gpu-memory-track'].hidden=!hasMemory;if(hasMemory){const percent=100*g.memory_used/g.memory_total;f['gpu-memory-bar'].style.width=percent+'%';f['gpu-memory'].className=percent>90?'warn':'';}
 f['disk-used'].textContent=bytes(d.disk.free)+' free · '+fmt(d.disk.percent)+'% used';f['disk-used'].className=d.disk.percent>=95?'bad':d.disk.percent>=85?'warn':'';f['disk-bar'].style.width=d.disk.percent+'%';f['disk-bar'].style.background=d.disk.percent>=95?'#ee958c':d.disk.percent>=85?'#e5ae51':'#89b9ed';f['disk-io'].textContent=finite(d.disk.read)&&finite(d.disk.write)?bytes(d.disk.read)+'/s · '+bytes(d.disk.write)+'/s':'Reading unavailable';f['disk-iops'].textContent=finite(d.disk.iops)?fmt(d.disk.iops,1)+' operations/s':'Reading unavailable';
 f.zfs.hidden=name!=='lake';f.services.hidden=name==='lake';f.services.textContent=name==='tower'?'Inkling '+(d.services.inference?'online':'unavailable')+' · T3 Code '+(d.services.workspace?'online':'unavailable'):name==='lake'?(d.sensors?.services||'Lake services unavailable'):'Live hardware telemetry';const minutes=Math.floor(d.uptime/60);f.uptime.textContent='Up '+Math.floor(minutes/1440)+'d '+Math.floor(minutes/60)%24+'h';f.ip.textContent=d.network.address;f.updated.textContent=new Date(d.timestamp*1000).toLocaleTimeString('en-GB');}
function table(parent,headers,rows,widths=[],decorate=null){const t=document.createElement('table');t.className='zfs-table';const head=t.createTHead().insertRow();headers.forEach((h,i)=>{const th=document.createElement('th');th.textContent=h;if(widths[i])th.style.width=widths[i];head.appendChild(th);});const body=t.createTBody();for(const [index,values] of rows.entries()){const r=body.insertRow();values.forEach((v,column)=>{const cell=r.insertCell();cell.textContent=String(v??'—');if(['DEGRADED','CANT_OPEN','UNAVAIL','FAULTED','MISSING'].includes(v))cell.className='warn';if(decorate)decorate(cell,column,index);});}parent.appendChild(t);}
function renderZFS(host){const target=hosts.lake?.f.zfs;if(!target)return;target.replaceChildren();if(!host?.online){target.hidden=true;return;}target.hidden=false;const z=host.metrics?.zfs;if(!z?.available||Math.abs(Date.now()/1000-z.timestamp)>35){row(target,'ZFS','Telemetry unavailable',true);return;}
 const root=z.datasets?.find(d=>d.name===z.name),drives=z.drives||[],healthy=drives.filter(d=>d.state==='ONLINE').length,errors=(z.read_errors||0)+(z.write_errors||0)+(z.checksum_errors||0);
 row(target,'ZFS '+z.state,bytes(z.raw_used)+' / '+bytes(z.raw_total)+' raw · '+fmt(z.raw_used/z.raw_total*100)+'%',z.state!=='ONLINE');
 const scan=z.scan||{};row(target,scan.state==='SCANNING'?'Rebuild / scrub':'Last scan',scan.state==='SCANNING'?fmt(z.scan_percent,2)+'% · '+(scan.function||''):scan.state||'No scan',false);
 if(scan.state==='SCANNING'&&finite(z.scan_percent)){const bar=document.createElement('div');bar.className='scan-progress';const fill=document.createElement('span');fill.style.width=z.scan_percent+'%';bar.appendChild(fill);target.appendChild(bar);}
 row(target,'Drive health',healthy+' online · '+(drives.length-healthy)+' unavailable · '+errors+' I/O errors',drives.length>healthy||errors>0);
 row(target,'Data integrity',(z.data_errors??'—')+' known data errors'+(root?' · '+bytes(root.used)+' data used':''),z.data_errors>0);
 const sorted=[...drives].sort((a,b)=>(a.port??99)-(b.port??99)||Number(!!b.missing)-Number(!!a.missing));
 const heading=document.createElement('h3');heading.className='section-heading';heading.textContent='Drives · live activity & health';target.appendChild(heading);
 table(target,['Port','Drive','State','Size','°C','Read/s','Write/s','IOPS','Busy','R/W/CRC'],sorted.map(d=>[d.port,(d.device||'removed')+' · '+(d.path||d.name).replace('-part1','').slice(-6)+(d.replacing&&!d.missing?' ↻':''),d.state==='CANT_OPEN'?'MISSING':d.state,bytes(d.size),fmt(d.temperature),bytes(d.read),bytes(d.write),fmt(d.iops),finite(d.busy)?fmt(d.busy)+'%':'—',[d.read_errors,d.write_errors,d.checksum_errors].map(n=>n??'—').join('/')]),['5%','19%','12%','10%','5%','11%','11%','7%','7%','13%'],(cell,col,index)=>{const d=sorted[index];if(col===2){const tag=document.createElement('span');tag.textContent=cell.textContent;tag.className='state-tag '+(d.state==='ONLINE'?'good':'bad');cell.replaceChildren(tag);}if(col===4&&d.temperature>=45)cell.className='warn';if(col===5&&finite(d.read))cell.className='read-rate';if(col===6&&finite(d.write))cell.className='write-rate';if(col===8&&finite(d.busy)){cell.className='busy-cell'+(d.busy>=80?' warn':'');cell.style.setProperty('--fill',Math.min(100,d.busy)+'%');}if(col===9)cell.className=(d.read_errors||d.write_errors||d.checksum_errors)?'bad':d.state==='ONLINE'?'good':'';});
 const ds=document.createElement('h3');ds.className='section-heading';ds.textContent='Datasets';target.appendChild(ds);table(target,['Dataset','Used / total¹','Free'],(z.datasets||[]).map(d=>[d.name,bytes(d.used)+' / '+bytes(d.used+d.available),bytes(d.available)]),['38%','40%','22%']);
 const note=document.createElement('p');note.className='note';note.textContent='Port = SATA port. R/W/CRC = errors. ↻ replacement. ¹ Dataset capacity includes shared free space; raw capacity includes parity.';target.appendChild(note);

}
async function refresh(){try{const r=await fetch('/api/fleet',{cache:'no-store',signal:AbortSignal.timeout(3500)});if(!r.ok)throw Error();const data=await r.json();for(const name of [...new Set([...order,...Object.keys(data)])]){if(data[name])renderHost(name,data[name]);}renderZFS(data.lake);const online=Object.values(data).filter(h=>h.online).length;$('summary').textContent=online+' / '+Object.keys(data).length+' machines online';}catch{for(const name of Object.keys(hosts))renderHost(name,{online:false});renderZFS(null);$('summary').textContent='Telemetry unavailable';}setTimeout(refresh,2000);}
function clock(){$('clock').textContent=new Date().toLocaleString('en-GB');}clock();setInterval(clock,1000);refresh();
</script></body></html>

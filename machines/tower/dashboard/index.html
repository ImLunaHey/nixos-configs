<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homelab · Machines</title>
<style>
:root{color-scheme:dark;font:18px/1.35 Inter,sans-serif;--bg:#111;--panel:#1e1e1e;--inset:#292929;--text:#eee;--muted:#aaa;--gap:16px;--pad:24px;--radius:20px;--blue:#89b9ed;--purple:#b9a2e8;--orange:#e7b57a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums;overflow:hidden}h1,h2,h3,p{margin:0}main{height:100vh;padding:28px 32px 20px;display:flex;flex-direction:column;gap:20px}header{display:flex;justify-content:space-between;align-items:center;min-height:64px}h1{font-size:36px;font-weight:500;letter-spacing:-1px}h2{font-size:30px;font-weight:500;letter-spacing:-.7px}h3{font-size:20px;font-weight:500}.eyebrow{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.clock{font-size:22px;color:#ccc}.wall{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px}.machines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:20px;min-height:0}.lake-host{min-height:0;display:flex}.lake-host>.machine{flex:1}.machine{padding:20px;border-radius:var(--radius);background:var(--panel);border:1px solid #ffffff08;display:grid;grid-template-rows:48px 82px minmax(100px,1fr) 22px 96px 22px 22px;gap:10px;min-height:0;min-width:0}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}.machine>.head{grid-row:1}.subtitle{font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:750px}.pill{font-size:16px;border-radius:30px;padding:6px 12px;background:#ffffff0a;color:#ccc;white-space:nowrap}.pill.online{color:#8ed6a0;background:#8ed6a015}.warn{color:#e5ae51!important}.bad{color:#ee958c!important}.tiles{grid-row:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{padding:10px 12px;background:var(--inset);border-radius:12px}.value{font-size:36px;line-height:40px;letter-spacing:-1px}.value small{font-size:18px;color:#bbb;margin-left:3px;letter-spacing:0}.label{font-size:16px;line-height:20px;color:var(--muted)}.graphs{grid-row:3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-height:0}.chart-box{padding:12px;background:var(--inset);border-radius:12px;display:grid;grid-template-rows:22px minmax(0,1fr) 20px;gap:8px;min-width:0;min-height:0}.legend{display:flex;gap:8px;align-items:center;font-size:16px;color:var(--muted);white-space:nowrap}.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;background:var(--blue)}.legend .purple{background:var(--purple)}.legend .orange{background:var(--orange)}.plot{position:relative;min-height:0;grid-row:2}.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}.line{fill:none;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}.gridline{stroke:#ffffff0a;stroke-width:1;vector-effect:non-scaling-stroke}.hint{font-size:14px;color:#999}.network .head{display:block}.network .head>.hint{display:none}.network>.row{grid-row:3;font-size:14px;white-space:nowrap}.network>.row>.hint{display:none}.unavailable{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#999;font-size:15px}.health-line{font-size:16px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.health-line[data-id="gpu-stats"]{grid-row:4}.health-line[data-id="services"]{grid-row:6}.details,.compact-zfs{grid-row:5;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-height:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:17px;line-height:22px;min-width:0}.row .key{color:var(--muted);flex-shrink:0}.row strong{font-weight:450;text-align:right}.bar{height:5px;background:#ffffff0b;border-radius:4px;overflow:hidden;flex-shrink:0}.bar span{display:block;height:100%;max-width:100%;background:#999}.footer{grid-row:7;display:flex;justify-content:space-between;gap:8px;color:#999;font-size:15px;line-height:22px;border-top:1px solid #ffffff09;padding-top:4px}.lake-host .machine{grid-template-rows:48px 82px 180px 22px minmax(0,1fr) 22px 22px}.lake-host .details{display:none}.compact-zfs{padding:16px;background:var(--inset);border-radius:12px;justify-content:flex-start;gap:12px}.compact-zfs .row{font-size:18px;line-height:24px}.compact-zfs .section-heading{font-size:20px;font-weight:500;margin-top:12px;padding-top:12px;border-top:1px solid #ffffff12}.zfs-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:17px}.zfs-table th{font-size:15px;color:#aaa;text-align:left;font-weight:400;border-bottom:1px solid #ffffff14;padding:8px 4px}.zfs-table td{padding:8px 4px;border-bottom:1px solid #ffffff08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.zfs-table th:nth-child(n+2),.zfs-table td:nth-child(n+2){text-align:right}.note{font-size:15px;line-height:22px;color:#999}.bottomline{display:flex;justify-content:space-between;align-items:center;gap:24px;color:#999;font-size:17px;min-height:24px}.offline-hosts{display:flex;gap:12px;align-items:center;white-space:nowrap}.offline-hosts:before{content:"Offline:"}.offline-hosts:empty:before{content:""}.offline-hosts .machine{display:block;background:none;border:0;padding:0}.offline-hosts h2{font-size:17px;color:#aaa;letter-spacing:0}.offline-hosts .subtitle,.offline-hosts .pill{display:none}#gateway-status.online{color:#8ed6a0}#gateway-status{color:#aaa;font-size:17px}[hidden]{display:none!important}
@media(max-height:1000px){main{padding:16px;gap:12px}.machine{padding:12px;gap:6px;grid-template-rows:40px 68px minmax(80px,1fr) 18px 78px 18px 18px}.lake-host .machine{grid-template-rows:40px 68px 120px 18px minmax(0,1fr) 18px 18px}.wall,.machines{gap:12px}.tile{padding:6px 10px}.value{font-size:28px;line-height:32px}.subtitle,.row,.label,.health-line{font-size:14px;line-height:18px}.zfs-table td,.zfs-table th{padding:4px}.compact-zfs{gap:6px}.compact-zfs .row{font-size:15px}.zfs-table{font-size:14px}}
</style></head><body><main><header><div><div class="eyebrow">Homelab / live system overview</div><h1>Machines</h1></div><div class="clock" id="clock"></div></header><div class="wall"><section class="machines" id="machines"></section><section class="lake-host" id="lake-host"></section></div><div class="bottomline"><div class="offline-hosts" id="offline-hosts"></div><span id="gateway-status">Gateway · connecting</span><span id="summary">Connecting…</span><span>Live · refreshes automatically</span></div></main>
<template id="host"><article class="machine"><div class="head"><div><h2 data-id="name"></h2><div class="subtitle" data-id="subtitle"></div></div><span class="pill" data-id="state"></span></div><div class="tiles" data-live><div class="tile"><div class="value" data-id="cpu"></div><div class="label">CPU load</div></div><div class="tile"><div class="value" data-id="ram"></div><div class="label">Memory used</div></div><div class="tile"><div class="value" data-id="temp"></div><div class="label">CPU temp</div></div><div class="tile"><div class="value" data-id="disk"></div><div class="label">Disk free</div></div></div><div class="graphs" data-live><div class="chart-box"><div class="legend"><span><i></i>CPU · 0–100%</span></div><div class="plot"><svg data-id="cpu-chart" viewBox="0 0 600 100" preserveAspectRatio="none"></svg></div></div><div class="chart-box"><div class="legend"><span><i class="purple"></i>GPU · 0–100%</span></div><div class="plot"><svg data-id="gpu-chart" viewBox="0 0 600 100" preserveAspectRatio="none"></svg><div class="unavailable" data-id="gpu-unavailable" hidden>Telemetry unavailable</div></div></div></div><div class="health-line" data-id="gpu-stats" data-live></div><div class="chart-box network" data-live><div class="head"><div class="legend"><span><i></i>↓ Receive</span><span><i class="orange"></i>↑ Transmit</span></div><span class="hint" data-id="net-scale"></span></div><div class="plot"><svg data-id="net-chart" viewBox="0 0 600 100" preserveAspectRatio="none"></svg></div><div class="row"><span data-id="net-rates"></span><span class="hint">Last 2 min</span></div></div><div class="details" data-live><div class="row"><span class="key">System disk</span><strong data-id="disk-used"></strong></div><div class="bar"><span data-id="disk-bar"></span></div><div class="row"><span class="key">Disk read / write</span><strong data-id="disk-io"></strong></div><div class="row"><span class="key">RAM available / total</span><strong data-id="ram-total"></strong></div></div><div class="compact-zfs" data-id="zfs" data-live hidden></div><div class="health-line" data-id="services" data-live></div><div class="footer" data-live><span data-id="uptime"></span><span data-id="ip"></span><span data-id="updated"></span></div></article></template>
<script>
const $=id=>document.getElementById(id),hosts={},histories={},order=['tower','lake','nova','gateway','pulsar','comet','gilbert','void'];
const finite=n=>typeof n==='number'&&Number.isFinite(n),fmt=(n,d=0)=>finite(n)?n.toFixed(d):'—',gib=n=>n/1073741824;
function bytes(n){if(!finite(n))return '—';let i=0;const units=['B','KiB','MiB','GiB','TiB'];while(n>=1024&&i<4){n/=1024;i++;}return fmt(n,i?1:0)+' '+units[i];}
function metric(el,n,unit){el.replaceChildren(document.createTextNode(n));const small=document.createElement('small');small.textContent=unit;el.appendChild(small);}
function row(parent,label,value,warn=false){const r=document.createElement('div');r.className='row';const key=document.createElement('span');key.className='key';key.textContent=label;const v=document.createElement('strong');v.textContent=value;if(warn)v.className='warn';r.append(key,v);parent.appendChild(r);}
function graph(el,history,keys,colors,max=100){let svg=[0,50,100].map(y=>`<path class="gridline" d="M0 ${y}H600"/>`).join('');for(let k=0;k<keys.length;k++){let path='',prev=null;for(const p of history){const n=p[keys[k]];if(!finite(n)){prev=null;continue;}const x=600-(history.at(-1).t-p.t)*5,y=98-Math.max(0,Math.min(1,n/max))*96;path+=`${prev!==null&&p.t-prev<10?'L':'M'}${x.toFixed(1)},${y.toFixed(1)} `;prev=p.t;}svg+=`<path class="line" stroke="${colors[k]}" d="${path}"/>`;}el.innerHTML=svg;}
function renderHost(name,host){if(name==='gateway'){const d=host.metrics,online=host.online&&d&&Math.abs(Date.now()/1000-d.timestamp)<12;const el=$('gateway-status');el.className=online?'online':'';el.textContent=online?'● Gateway online · CPU '+fmt(d.cpu.usage,1)+'% · RAM '+bytes(d.memory.used)+' · Free '+bytes(d.disk.free):'Gateway · offline';return;}if(!hosts[name]){const el=$('host').content.firstElementChild.cloneNode(true);el.querySelector('.graphs').appendChild(el.querySelector('.network'));hosts[name]={el,f:Object.fromEntries([...el.querySelectorAll('[data-id]')].map(x=>[x.dataset.id,x]))};histories[name]=[];}
 const {el,f}=hosts[name],d=host.metrics,online=host.online&&d&&Math.abs(Date.now()/1000-d.timestamp)<12;const container=$(online?(name==='lake'?'lake-host':'machines'):'offline-hosts');container.appendChild(el);f.name.textContent=name;f.state.textContent=online?'● Online':'● Offline';f.state.className='pill'+(online?' online':' warn');el.querySelectorAll('[data-live]').forEach(x=>x.hidden=!online);if(!online)return;
 f.subtitle.textContent=d.cpu_name;metric(f.cpu,fmt(d.cpu.usage,1),'%');metric(f.ram,fmt(gib(d.memory.used),1),'GiB');metric(f.temp,fmt(d.cpu.temperature),finite(d.cpu.temperature)?'°C':'');metric(f.disk,fmt(gib(d.disk.free)),'GiB');
 const history=histories[name];if(history.at(-1)?.t!==d.timestamp){history.push({t:d.timestamp,cpu:d.cpu.usage,gpu:d.gpu?.usage??null,rx:d.network.download,tx:d.network.upload});while(history.length&&d.timestamp-history[0].t>120)history.shift();}
 graph(f['cpu-chart'],history,['cpu'],['#89b9ed']);graph(f['gpu-chart'],history,['gpu'],['#b9a2e8']);f['gpu-unavailable'].hidden=finite(d.gpu?.usage);const max=Math.max(1024,...history.flatMap(p=>[p.rx,p.tx]).filter(finite));graph(f['net-chart'],history,['rx','tx'],['#89b9ed','#e7b57a'],max);f['net-scale'].textContent=bytes(max)+'/s max';f['net-rates'].textContent='↓ '+bytes(d.network.download)+'/s   ↑ '+bytes(d.network.upload)+'/s';
 if(d.gpu){const g=d.gpu;f['gpu-stats'].textContent=g.name.replace('NVIDIA GeForce ','')+' · '+fmt(g.usage)+'% · '+fmt(g.temperature)+'°C'+(finite(g.power)?' · '+fmt(g.power)+' W':'')+' · '+(g.memory_label||'VRAM')+' '+fmt(g.memory_used/1024,1)+' / '+fmt(g.memory_total/1024,1)+' GiB';}else f['gpu-stats'].textContent=d.os==='darwin'?'Apple GPU telemetry not exposed by this collector':'No supported GPU telemetry';
 f['disk-used'].textContent=bytes(d.disk.used)+' / '+bytes(d.disk.total);f['disk-bar'].style.width=d.disk.percent+'%';f['disk-io'].textContent=bytes(d.disk.read)+'/s · '+bytes(d.disk.write)+'/s';f['ram-total'].textContent=bytes(d.memory.available)+' / '+bytes(d.memory.total);
 f.zfs.hidden=name!=='lake';f.services.hidden=name==='lake';f.services.textContent=name==='tower'?'Inkling '+(d.services.inference?'online':'unavailable')+' · T3 Code '+(d.services.workspace?'online':'unavailable'):name==='lake'?(d.sensors?.services||'Lake services unavailable'):'Live hardware telemetry';const minutes=Math.floor(d.uptime/60);f.uptime.textContent='Up '+Math.floor(minutes/1440)+'d '+Math.floor(minutes/60)%24+'h';f.ip.textContent=d.network.address;f.updated.textContent=new Date(d.timestamp*1000).toLocaleTimeString('en-GB');}
function table(parent,headers,rows,widths=[]){const t=document.createElement('table');t.className='zfs-table';const head=t.createTHead().insertRow();headers.forEach((h,i)=>{const th=document.createElement('th');th.textContent=h;if(widths[i])th.style.width=widths[i];head.appendChild(th);});const body=t.createTBody();for(const values of rows){const r=body.insertRow();values.forEach(v=>{const cell=r.insertCell();cell.textContent=String(v??'—');if(['DEGRADED','CANT_OPEN','UNAVAIL','FAULTED'].includes(v))cell.className='warn';});}parent.appendChild(t);}
function section(title){const s=document.createElement('section');s.className='section';const h=document.createElement('h3');h.textContent=title;s.appendChild(h);$('zfs-body').appendChild(s);return s;}
function renderZFS(host){const target=hosts.lake?.f.zfs;if(!target)return;target.replaceChildren();if(!host?.online){target.hidden=true;return;}target.hidden=false;const z=host.metrics?.zfs;if(!z?.available||Math.abs(Date.now()/1000-z.timestamp)>35){row(target,'ZFS','Telemetry unavailable',true);return;}
 const root=z.datasets?.find(d=>d.name===z.name),drives=z.drives||[],healthy=drives.filter(d=>d.state==='ONLINE').length,errors=(z.read_errors||0)+(z.write_errors||0)+(z.checksum_errors||0);
 row(target,'ZFS '+z.state,fmt(z.raw_used/z.raw_total*100)+'% raw allocated · '+bytes(root?.available)+' usable free',z.state!=='ONLINE');
 const scan=z.scan||{};row(target,scan.state==='SCANNING'?'Rebuild / scrub':'Last scan',scan.state==='SCANNING'?fmt(z.scan_percent,2)+'% · '+(scan.function||''):scan.state||'No scan',false);
 row(target,'Drive health',healthy+' online · '+(drives.length-healthy)+' unavailable · '+errors+' I/O errors',drives.length>healthy||errors>0);
 row(target,'Data integrity',(z.data_errors??'—')+' known data errors'+(root?' · '+bytes(root.used)+' data used':''),z.data_errors>0);
 const heading=document.createElement('h3');heading.className='section-heading';heading.textContent='Drive health · read / write / checksum';target.appendChild(heading);
 table(target,['Drive','State','R','W','CRC'],[...drives].sort((a,b)=>(a.path||a.name).localeCompare(b.path||b.name)).map(d=>[(d.path||d.name).replace('-part1','').slice(-12)+(d.missing?' (old)':d.replacing?' ↻':''),d.state,d.read_errors,d.write_errors,d.checksum_errors]),['36%','28%','12%','12%','12%']);
 const ds=document.createElement('h3');ds.className='section-heading';ds.textContent='Datasets';target.appendChild(ds);table(target,['Dataset','Used','Available'],(z.datasets||[]).map(d=>[d.name,bytes(d.used),bytes(d.available)]),['44%','28%','28%']);
 const note=document.createElement('p');note.className='note';note.textContent='Raw capacity includes parity. Dataset available space is shared. ↻ replacement drive; old = removed member.';target.appendChild(note);

}
async function refresh(){try{const r=await fetch('/api/fleet',{cache:'no-store',signal:AbortSignal.timeout(3500)});if(!r.ok)throw Error();const data=await r.json();for(const name of [...new Set([...order,...Object.keys(data)])]){if(data[name])renderHost(name,data[name]);}renderZFS(data.lake);const online=Object.values(data).filter(h=>h.online).length;$('summary').textContent=online+' / '+Object.keys(data).length+' machines online';}catch{for(const name of Object.keys(hosts))renderHost(name,{online:false});renderZFS(null);$('summary').textContent='Telemetry unavailable';}setTimeout(refresh,2000);}
function clock(){$('clock').textContent=new Date().toLocaleString('en-GB');}clock();setInterval(clock,1000);refresh();
</script></body></html>
